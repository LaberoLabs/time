<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TIME</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <!-- The score is downloaded while the scene is still being built (that work blocks the main thread for seconds, and a
       download started from JavaScript would not begin until it ends). Same URLs and request mode as the fetch() in music.js;
       low priority, so the page's own script and fonts are never held up by it. -->
  <link rel="preload" as="fetch" crossorigin fetchpriority="low" href="audio/track1.mp3" />
  <link rel="preload" as="fetch" crossorigin fetchpriority="low" href="audio/track2.mp3" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Inter:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    :root { --ink: rgba(255, 244, 230, 0.92); --dim: rgba(255, 238, 220, 0.55); }
    html, body { margin: 0; background: #0d0907; color: var(--ink); }
    body { overscroll-behavior: none; }
    #scroll { height: 5400vh; }
    canvas#c { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; opacity: 0; transition: opacity 2.4s ease; }
    canvas#c.on { opacity: 1; }
    .ui { position: fixed; inset: 0; pointer-events: none; font-family: 'Inter', -apple-system, Helvetica, sans-serif; }
    .ui header { position: absolute; left: 44px; top: 38px; }
    .title { font-family: 'Cormorant Garamond', 'Iowan Old Style', Georgia, serif; font-weight: 400; font-size: 30px; letter-spacing: 0.42em; }
    .sub { margin-top: 6px; font-family: 'Cormorant Garamond', 'Iowan Old Style', Georgia, serif; font-style: italic; font-weight: 300; font-size: 17px; color: var(--dim); letter-spacing: 0.02em; }
    .age { position: absolute; left: 44px; bottom: 40px; display: flex; align-items: baseline; gap: 16px; }
    .age .lbl { font-size: 11px; letter-spacing: 0.32em; color: var(--dim); }
    .age .num { font-family: 'Cormorant Garamond', 'Iowan Old Style', Georgia, serif; font-weight: 300; font-size: 64px; line-height: 1; font-variant-numeric: lining-nums tabular-nums; min-width: 1.2em; }
    .age .rule { position: absolute; left: 0; right: 0; bottom: -12px; height: 1px; background: rgba(255, 240, 225, 0.35); transform-origin: left; }
    .hint { position: absolute; left: 50%; bottom: 46px; transform: translateX(-50%); font-size: 10.5px; letter-spacing: 0.34em; color: var(--dim); transition: opacity 1.6s ease; white-space: nowrap; }
    .hint.gone { opacity: 0; }
    #black { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; }
    /* the wait before the first frame: the title alone, until the room is ready (body.ready), then it clears as the room appears */
    #loading { position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
      background: #0d0907; pointer-events: none; opacity: 1; transition: opacity 1.2s ease, visibility 0s linear 1.2s; animation: loadin 1.8s ease 0.2s backwards; }
    #loading .title { padding-left: 0.42em; color: rgba(255, 244, 230, 0.8); } /* (the trailing letter-space balanced, so it sits centred) */
    #loading .sub { color: rgba(255, 238, 220, 0.45); }
    .ready #loading { opacity: 0; visibility: hidden; }
    @keyframes loadin { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { #loading { animation: none; } }
    .ui > * { text-shadow: 0 1px 18px rgba(0, 0, 0, 0.35); }
    .fadein { opacity: 0; transition: opacity 2.4s ease 0.6s; }
    .ready .fadein { opacity: 1; }
    /* .ready .fadein (above) is as specific as .hint.gone, and later, so a hint could never fade out: these win */
    .ready .hint.gone { opacity: 0; transition: opacity 1.6s ease; }
    /* the sound cue sits just below the scroll hint, never on it */
    #sound { bottom: 22px; }
    @media (max-width: 640px) {
      .ui header { left: 22px; top: 24px; } .age { left: 22px; bottom: 28px; } .title { font-size: 22px; }
      .age .num { font-size: 48px; } .hint { bottom: 96px; } #sound { bottom: 70px; }
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="ui">
    <header class="fadein">
      <div class="title">TIME</div>
      <div class="sub">A lifetime told through a single room.</div>
    </header>
    <div class="hint fadein" id="hint">SCROLL TO MOVE THROUGH TIME</div>
    <div class="hint fadein" id="sound">CLICK ANYWHERE FOR SOUND</div>
  </div>
  <div id="black"></div>
  <div id="loading" aria-hidden="true">
    <div class="title">TIME</div>
    <div class="sub">A lifetime told through a single room.</div>
  </div>
  <div id="scroll"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
