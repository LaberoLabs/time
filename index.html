<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TIME</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Inter:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    :root { --ink: rgba(255, 244, 230, 0.92); --dim: rgba(255, 238, 220, 0.55); }
    html, body { margin: 0; background: #0d0907; color: var(--ink); }
    body { overscroll-behavior: none; }
    #scroll { height: 1800vh; }
    canvas#c { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; opacity: 0; transition: opacity 2.4s ease; }
    canvas#c.on { opacity: 1; }
    .ui { position: fixed; inset: 0; pointer-events: none; font-family: 'Inter', -apple-system, Helvetica, sans-serif; }
    .ui header { position: absolute; left: 44px; top: 38px; }
    .title { font-family: 'Cormorant Garamond', 'Iowan Old Style', Georgia, serif; font-weight: 400; font-size: 30px; letter-spacing: 0.42em; }
    .sub { margin-top: 6px; font-family: 'Cormorant Garamond', 'Iowan Old Style', Georgia, serif; font-style: italic; font-weight: 300; font-size: 17px; color: var(--dim); letter-spacing: 0.02em; }
    .age { position: absolute; left: 44px; bottom: 40px; display: flex; align-items: baseline; gap: 16px; }
    .age .lbl { font-size: 11px; letter-spacing: 0.32em; color: var(--dim); }
    .age .num { font-family: 'Cormorant Garamond', 'Iowan Old Style', Georgia, serif; font-weight: 300; font-size: 64px; line-height: 1; font-variant-numeric: lining-nums tabular-nums; min-width: 1.2em; }
    .age .rule { position: absolute; left: 0; right: 0; bottom: -12px; height: 1px; background: rgba(255, 240, 225, 0.35); transform-origin: left; }
    .hint { position: absolute; left: 50%; bottom: 46px; transform: translateX(-50%); font-size: 10.5px; letter-spacing: 0.34em; color: var(--dim); transition: opacity 1.6s ease; white-space: nowrap; }
    .hint.gone { opacity: 0; }
    .ui > * { text-shadow: 0 1px 18px rgba(0, 0, 0, 0.35); }
    .fadein { opacity: 0; transition: opacity 2.4s ease 0.6s; }
    .ready .fadein { opacity: 1; }
    @media (max-width: 640px) {
      .ui header { left: 22px; top: 24px; } .age { left: 22px; bottom: 28px; } .title { font-size: 22px; }
      .age .num { font-size: 48px; } .hint { bottom: 96px; }
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="ui">
    <header class="fadein">
      <div class="title">TIME</div>
      <div class="sub">A lifetime told through a single room.</div>
    </header>
    <div class="age fadein"><span class="lbl">AGE</span><span class="num" id="age">25</span></div>
    <div class="hint fadein" id="hint">SCROLL TO MOVE THROUGH TIME</div>
  </div>
  <div id="scroll"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
